<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">画布收藏夹应用图标</title>
  <desc id="desc">网页、应用、笔记与评分星组成的贴纸堆，摆放在点阵画布上。</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f6f7"/>
      <stop offset="1" stop-color="#f9f8f8"/>
    </linearGradient>
    <linearGradient id="appBlue" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#50bde7"/>
      <stop offset="1" stop-color="#4b80ef"/>
    </linearGradient>
    <linearGradient id="starGold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffd66b"/>
      <stop offset="1" stop-color="#ffc44d"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#687079" flood-opacity="0.11"/>
    </filter>
    <filter id="stickerShadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#727981" flood-opacity="0.16"/>
    </filter>
    <filter id="toolLift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#2f72c7" flood-opacity="0.22"/>
    </filter>
    <clipPath id="noteClip">
      <rect x="648" y="580" width="214" height="178" rx="37"/>
    </clipPath>
  </defs>

  <rect width="1254" height="1254" fill="url(#pageBg)"/>
  <rect x="288" y="257" width="678" height="699" rx="139" fill="#fbfaf7" stroke="#f0eee9" stroke-width="2" filter="url(#tileShadow)"/>

  <g fill="#d4d7d8" opacity="0.87">
    <circle cx="354" cy="337" r="6"/><circle cx="466" cy="337" r="6"/><circle cx="578" cy="337" r="6"/><circle cx="690" cy="337" r="6"/><circle cx="802" cy="337" r="6"/><circle cx="914" cy="337" r="6"/>
    <circle cx="354" cy="447" r="6"/><circle cx="466" cy="447" r="6"/><circle cx="578" cy="447" r="6"/><circle cx="690" cy="447" r="6"/><circle cx="802" cy="447" r="6"/><circle cx="914" cy="447" r="6"/>
    <circle cx="354" cy="557" r="6"/><circle cx="466" cy="557" r="6"/><circle cx="578" cy="557" r="6"/><circle cx="690" cy="557" r="6"/><circle cx="802" cy="557" r="6"/><circle cx="914" cy="557" r="6"/>
    <circle cx="354" cy="667" r="6"/><circle cx="466" cy="667" r="6"/><circle cx="578" cy="667" r="6"/><circle cx="690" cy="667" r="6"/><circle cx="802" cy="667" r="6"/><circle cx="914" cy="667" r="6"/>
    <circle cx="354" cy="777" r="6"/><circle cx="466" cy="777" r="6"/><circle cx="578" cy="777" r="6"/><circle cx="690" cy="777" r="6"/><circle cx="802" cy="777" r="6"/><circle cx="914" cy="777" r="6"/>
    <circle cx="354" cy="887" r="6"/><circle cx="466" cy="887" r="6"/><circle cx="578" cy="887" r="6"/><circle cx="690" cy="887" r="6"/><circle cx="802" cy="887" r="6"/><circle cx="914" cy="887" r="6"/>
  </g>

  <!-- Web sticker. -->
  <g filter="url(#stickerShadow)" transform="rotate(4 691 478)">
    <circle cx="691" cy="478" r="94" fill="#fff" stroke="#fff" stroke-width="14"/>
    <g fill="none" stroke="#3aa8df" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="691" cy="478" r="71"/>
      <ellipse cx="691" cy="478" rx="31" ry="71"/>
      <path d="M625 452c41 16 91 16 132 0M625 504c41-16 91-16 132 0"/>
    </g>
  </g>

  <!-- Note sticker. -->
  <g filter="url(#stickerShadow)" transform="rotate(12.7 755 669)">
    <g clip-path="url(#noteClip)">
      <rect x="648" y="580" width="214" height="178" fill="#fff"/>
      <rect x="648" y="580" width="214" height="76" fill="#ffa38e"/>
    </g>
    <rect x="648" y="580" width="214" height="178" rx="37" fill="none" stroke="#fff" stroke-width="15"/>
    <path d="M703 686h91M703 714h72" fill="none" stroke="#d0d1d2" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- App sticker. -->
  <g filter="url(#stickerShadow)" transform="rotate(-8.65 525.5 596.5)">
    <rect x="398" y="470" width="255" height="253" rx="53" fill="url(#appBlue)" stroke="#fff" stroke-width="16"/>
    <g fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round">
      <path d="M476 665L524 526" filter="url(#toolLift)"/>
      <path d="M535 557L604 649" filter="url(#toolLift)"/>
      <path d="M451 620L610 592" filter="url(#toolLift)"/>
    </g>
  </g>

  <!-- Rating sticker, deliberately large and foremost. -->
  <g filter="url(#stickerShadow)" transform="rotate(-3.5 586 770) translate(586 770) scale(1.48) translate(-586 -770)">
    <path d="M586 688L606 746L670 748L619 785L638 849L586 811L532 849L552 785L507 748L566 746Z"
      fill="url(#starGold)" stroke="#fff" stroke-width="19" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
